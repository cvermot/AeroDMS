<p>Vol balade</p>
<p>Règle appliquée :</p>
<p>Le pilote est remboursé des 7/8ieme du coût réel du vol. </p>
<p>Le CSE subventionne le vol à 50%. </p>
<p>Le passager règle au CSE les 3/4 du reste à charge, le pilote prend à sa charge 1/4 du reste à charge (participation du pilote aux coûts du vol).</p>
